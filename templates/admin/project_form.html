{% extends "base.html" %}
{% block title %}{{ 'Editar' if item else 'Nuevo' }} proyecto{% endblock %}
{% block content %}
<h1>{{ 'Editar' if item else 'Nuevo' }} proyecto</h1>
<form class="form" method="post">
  <label>Título <input type="text" name="title" value="{{ item.title if item }}"></label>
  <label>Descripción <textarea name="description" rows="6">{{ item.description if item }}</textarea></label>
  <label>URL de imagen <input type="text" name="image_url" value="{{ item.image_url if item }}"></label>
  <div class="grid-2">
    <label>Repositorio <input type="url" name="repo_url" value="{{ item.repo_url if item }}"></label>
    <label>Demo <input type="url" name="live_url" value="{{ item.live_url if item }}"></label>
  </div>
  <label>Open Source
    <select name="is_open_source">
      <option value="1" {% if item and item.is_open_source %}selected{% endif %}>Sí</option>
      <option value="0" {% if item and not item.is_open_source %}selected{% endif %}>No</option>
    </select>
  </label>
  <button class="btn primary" type="submit">Guardar</button>
</form>
{% endblock %}
